spring:
  application:
    name: y-ai-agent

  profiles:
    active: local
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
    # MCP 配置(stdio模式)
#    mcp:
#      client:
#        stdio:
#          servers-configuration: classpath:mcp-servers.json

  datasource:
    # MySQL 数据库连接配置
    url: jdbc:mysql://127.0.0.1:3306/y_ai_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池配置（HikariCP 默认）
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
# 端口配置
server:
  port: 8080
  servlet:
    context-path: /api
# MyBatis-Plus 配置
mybatis-plus:
  # 实体类扫描包（可选，如果使用了 @TableName 可以自动识别）
  type-aliases-package: com.yang.yaiagent.domain
  # Mapper XML 文件位置（如果使用 XML 则配置）
  mapper-locations: classpath:mapper/*.xml
  # 全局配置
  global-config:
    db-config:
      # 主键类型：AUTO 表示自增
      id-type: auto
      # 表名策略：下划线转驼峰
      table-underline: true
      # 逻辑删除配置（如需要）
      # logic-delete-field: deleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0
  # 配置项
  configuration:
    # 开启下划线转驼峰
    map-underscore-to-camel-case: true
    # 开启日志（开发环境建议开启，生产环境关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启二级缓存（按需）
    cache-enabled: false


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.yang.yaiagent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

#searchAPI
search-api:
  api-key: ${SEARCH_API_KEY}
